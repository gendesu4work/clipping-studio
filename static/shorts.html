<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My shorts</title>
<style>
:root{
  --bg:#0d0e11; --panel:#16181d; --panel2:#1d2027; --line:#2a2e37; --text:#eceef2; --dim:#9aa1ad;
  --accent:#3ddc84; --accent-ink:#04210f; --yellow:#ffd60a; --red:#ff5a5a; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:13px}
.brand small{font-weight:500;color:var(--dim);margin-left:6px}
button,.btn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:9px;padding:7px 12px;text-decoration:none;
  border:1px solid var(--line);background:var(--panel2);color:var(--text);display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:#3b404b}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ghost{background:none;color:var(--dim)}
.del{background:rgba(255,90,90,.1);color:var(--red);border-color:rgba(255,90,90,.35)}
.del:hover{background:var(--red);border-color:var(--red);color:#fff}
main{padding:24px 28px;max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card video{width:100%;aspect-ratio:9/16;background:#000;display:block;object-fit:contain}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{color:var(--dim);font-size:12px}
.card .instr{color:var(--dim);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto;padding-top:8px}
.card .acts button{justify-content:center;height:34px;padding:0 6px;min-width:0;white-space:nowrap}
.card .acts svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card .acts span{overflow:hidden;text-overflow:ellipsis}
.card{container-type:inline-size}
@container (max-width:285px){.card .acts span{display:none}.card .acts svg{width:17px;height:17px}}
.empty{color:var(--dim);text-align:center;padding:80px 20px;border:2px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px 22px}
.sheet h2{margin:0 0 2px;font-size:17px}
.sheet .sub{color:var(--dim);font-size:12px;margin-bottom:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.field .lab{display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.field .lab button{padding:3px 9px;font-size:11px;text-transform:none;letter-spacing:0}
.field .val{white-space:pre-wrap;word-break:break-word}
.field .tags{color:var(--accent);margin-top:6px}
.field.when .val b{color:var(--yellow)}
.field.when .why{color:var(--dim);font-size:13px;margin-top:2px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.busy{color:var(--dim);text-align:center;padding:34px 10px}
.busy i{display:block;width:26px;height:26px;margin:0 auto 10px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--red);padding:10px 0}
@media (max-width:520px){header,main{padding:14px 16px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>▶</i>My shorts<small id="count"></small></div>
  <button class="ghost" id="refresh">Refresh</button>
</header>
<main><div id="list"></div></main>
<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">Upload copy</h2><div class="sub" id="mSub"></div><div id="mBody"></div><div class="foot"><button class="ghost" id="mRedo">↻ Try another</button><button id="mClose">Close</button></div></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[<&>"]/g, c => ({"<": "&lt;", "&": "&amp;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fileUrl = n => "/api/outputs/file/" + encodeURIComponent(n);
const when = t => new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});

async function load() {
  let items = [];
  try { items = (await (await fetch("/api/outputs")).json()).items || []; } catch (e) {}
  $("count").textContent = items.length ? items.length + (items.length === 1 ? " video" : " videos") : "";
  if (!items.length) {
    $("list").innerHTML = `<div class="empty"><b>No shorts yet</b>Every video you make in ClipForge is saved here automatically.</div>`;
    return;
  }
  $("list").innerHTML = `<div class="grid">` + items.map(it => `
    <div class="card" data-name="${esc(it.name)}">
      <video src="${fileUrl(it.name)}#t=0.1" preload="metadata" controls playsinline></video>
      <div class="body">
        <b title="${esc(it.name)}">${esc(it.name.replace(/ \(ClipForge\)(?= \(\d+\))?/, "").replace(/\.mp4$/i, ""))}</b>
        <div class="meta">${when(it.created)} · ${fmt(it.duration)} · ${(it.size / 1048576).toFixed(1)} MB</div>
        ${it.instructions ? `<div class="instr" title="${esc(it.instructions)}">“${esc(it.instructions)}”</div>` : ""}
        <div class="acts">
          <button class="primary dl" title="Download" aria-label="Download"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Save</span></button>
          <button class="cap" title="Best caption, description and upload time" aria-label="Caption"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg><span>Caption</span></button>
          <button class="del" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span>Delete</span></button>
        </div>
      </div>
    </div>`).join("") + `</div>`;
}

// fetch -> blob -> <a download>: plain attachment links don't save inside the app window
async function save(name, btn) {
  const old = btn.innerHTML, label = t => { const sp = btn.querySelector("span"); if (sp) sp.textContent = t; };
  btn.disabled = true; label("Saving…");
  try {
    const r = await fetch(fileUrl(name) + "?dl=1");
    if (!r.ok) throw new Error();
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    label("Saved");
  } catch (e) { label("Failed"); }
  setTimeout(() => { btn.innerHTML = old; btn.disabled = false; }, 2200);
}

$("list").addEventListener("click", async e => {
  const card = e.target.closest(".card"); if (!card) return;
  const name = card.dataset.name;
  if (e.target.closest(".dl")) save(name, e.target.closest(".dl"));
  if (e.target.closest(".cap")) openCopy(name);
  if (e.target.closest(".del")) {
    if (!confirm(`Delete “${name}”? This can't be undone.`)) return;
    await fetch(fileUrl(name), {method: "DELETE"});
    load();
  }
});
// ---- Caption popup: AI caption, description and best upload time
let capName = null;
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
function field(label, text, extra = "", cls = "") {
  return `<div class="field ${cls}"><div class="lab">${label}<button class="cp" data-text="${esc(text)}">Copy</button></div>
    <div class="val">${extra || esc(text)}</div></div>`;
}
async function openCopy(name, refresh) {
  capName = name;
  $("mSub").textContent = name.replace(/ \(ClipForge\)(?= \(\d+\))?/, "").replace(/\.mp4$/i, "");
  $("mBody").innerHTML = `<div class="busy"><i></i>Watching the words and writing your caption…<br><small>The first time can take a minute.</small></div>`;
  $("mRedo").disabled = true;
  $("modal").classList.add("open");
  try {
    const r = await fetch("/api/outputs/copy/" + encodeURIComponent(name), {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({tz, refresh: !!refresh})});
    const d = await r.json().catch(() => ({error: "The app needs a restart to use captions. Close and reopen Creator Studio."}));
    if (capName !== name) return;
    if (!r.ok) throw new Error(d.error || "Something went wrong.");
    const tags = (d.hashtags || []).join(" ");
    const desc = d.description + (tags ? "\n\n" + tags : "");
    const bt = d.best_time || {};
    const whenText = [bt.day, bt.time].filter(Boolean).join(", ");
    $("mBody").innerHTML =
      field("Caption", d.caption) +
      field("Description", desc, esc(d.description) + (tags ? `<div class="tags">${esc(tags)}</div>` : "")) +
      field("Best time to upload", whenText + (tz ? ` (${tz})` : ""),
            `<b>${esc(whenText || "Any time")}</b>${tz ? ` <small>(${esc(tz)})</small>` : ""}` +
            (bt.reason ? `<div class="why">${esc(bt.reason)}</div>` : ""), "when");
  } catch (e) {
    if (capName === name) $("mBody").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
  if (capName === name) $("mRedo").disabled = false;
}
function closeCopy() { capName = null; $("modal").classList.remove("open"); }
$("mClose").onclick = closeCopy;
$("mRedo").onclick = () => capName && openCopy(capName, true);
$("modal").addEventListener("click", async e => {
  if (e.target === $("modal")) return closeCopy();
  const b = e.target.closest(".cp"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.text); b.textContent = "✓ Copied"; }
  catch (_) { b.textContent = "Couldn't copy"; }
  setTimeout(() => b.textContent = "Copy", 1600);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("modal").classList.contains("open")) closeCopy(); });
$("refresh").onclick = load;
window.loadShorts = load;   // called by the app shell when this tab opens
load();
</script>
</body>
</html>
