<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Studio</title>
<link rel="icon" href="/static/icon.png">
<style>
:root{--bar:#0d0e11;--line:#24272e;--text:#eceef2;--dim:#8f96a3;--red:#f0443e;--yellow:#ffd60a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bar);font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--text)}
body{display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:6px;padding:0 18px;height:52px;border-bottom:1px solid var(--line);flex:none}
.logo{font-weight:700;letter-spacing:.02em;margin-right:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--red),var(--yellow));display:inline-block}
.tab{background:none;border:0;color:var(--dim);font:inherit;font-weight:600;padding:0 14px;height:52px;cursor:pointer;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--c)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.badge{background:var(--yellow);color:#1a1500;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700;display:none}
nav{position:relative;z-index:1;background:rgba(13,14,17,.82);backdrop-filter:blur(6px)}
.frames{flex:1;position:relative;z-index:1}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}
/* money counter background: $0 -> $1,000,000 over one hour, then loops */
#moneyBg{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(ellipse at center,#121215 0%,#0b0b0d 55%,#050506 100%);overflow:hidden}
#moneyBg span{font:700 clamp(64px,13vw,220px)/1 Arial,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;
  color:#8c8780;opacity:.22;white-space:nowrap;letter-spacing:-.01em}
iframe.on{display:block}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d2027;border:1px solid var(--line);
  padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.discord{margin-left:auto;display:flex;align-items:center;gap:8px;background:#5865f2;color:#fff;text-decoration:none;
  font-weight:600;padding:7px 14px;border-radius:8px;white-space:nowrap;transition:background .15s,transform .15s}
.discord:hover{background:#4752c4;transform:translateY(-1px)}
.discord:focus-visible{outline:2px solid #fff;outline-offset:2px}
.discord svg{width:18px;height:18px;fill:currentColor;flex:none}
@media (max-width:900px){.discord span{display:none}.discord{padding:7px 9px}}
@media (max-width:520px){.logo span{display:none}.tab{padding:0 8px}}
</style>
</head>
<body>
<div id="moneyBg" aria-hidden="true"><span>$ 0</span></div>
<nav>
  <div class="logo"><i></i><span>Creator Studio</span></div>
  <button class="tab" data-tab="downloader" style="--c:var(--red)"><span class="dot"></span>Clip downloader</button>
  <button class="tab" data-tab="twitch" style="--c:#9d6bff"><span class="dot"></span>Twitch clips</button>
  <button class="tab" data-tab="clipforge" style="--c:var(--yellow)"><span class="dot"></span>ClipForge<span class="badge" id="newBadge">new</span></button>
  <button class="tab" data-tab="shorts" style="--c:#3ddc84"><span class="dot"></span>My shorts<span class="badge" id="shortsBadge" style="background:#3ddc84;color:#04210f">new</span></button>
  <a class="discord" href="https://discord.gg/UdpUhgYKcf" target="_blank" rel="noopener"
     title="Join the Creator Studio community on Discord" aria-label="Join the community on Discord">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.89-1.52.07.07 0 0 0-.08.04c-.21.37-.44.86-.6 1.25a18.3 18.3 0 0 0-5.49 0 12.6 12.6 0 0 0-.62-1.25.08.08 0 0 0-.08-.04 19.7 19.7 0 0 0-4.88 1.52.07.07 0 0 0-.03.03C.53 9.05-.32 13.58.1 18.06a.08.08 0 0 0 .03.06 19.9 19.9 0 0 0 5.99 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.3 1.23-1.99a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.87-.89.08.08 0 0 1-.01-.13l.37-.29a.07.07 0 0 1 .08-.01c3.93 1.79 8.18 1.79 12.06 0a.07.07 0 0 1 .08.01l.37.29a.08.08 0 0 1-.01.13c-.6.35-1.22.65-1.87.89a.08.08 0 0 0-.04.11c.36.7.77 1.36 1.22 1.99a.08.08 0 0 0 .08.03 19.8 19.8 0 0 0 6-3.03.08.08 0 0 0 .03-.06c.5-5.18-.84-9.67-3.55-13.66a.06.06 0 0 0-.03-.03zM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.96 2.42-2.16 2.42zm7.97 0c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.94 2.42-2.16 2.42z"/></svg>
    <span>Join our Discord</span>
  </a>
</nav>
<div class="frames">
  <iframe id="f-downloader" src="/clipper" title="Clip downloader"></iframe>
  <iframe id="f-twitch" src="/twitch" title="Twitch clips"></iframe>
  <iframe id="f-clipforge" src="/forge" title="ClipForge"></iframe>
  <iframe id="f-shorts" src="/shorts" title="My shorts"></iframe>
</div>
<div id="toast"></div>

<script>
const frames = { downloader: document.getElementById("f-downloader"), twitch: document.getElementById("f-twitch"),
                 clipforge: document.getElementById("f-clipforge"), shorts: document.getElementById("f-shorts") };
function show(tab) {
  if (!frames[tab]) tab = "downloader";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  Object.entries(frames).forEach(([k, f]) => f.classList.toggle("on", k === tab));
  history.replaceState(null, "", "#" + tab);
  if (tab === "clipforge") {
    document.getElementById("newBadge").style.display = "none";
    try { frames.clipforge.contentWindow.loadLibrary(); } catch (e) {}
  }
  if (tab === "shorts") {
    document.getElementById("shortsBadge").style.display = "none";
    try { frames.shorts.contentWindow.loadShorts(); } catch (e) {}
  }
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => show(t.dataset.tab));

// money counter background: $0 -> $1,000,000 over one hour, then starts over
const moneyEl = document.querySelector("#moneyBg span"), moneyStart = performance.now(), HOUR = 3600e3;
let lastMoney = -1;
setInterval(() => {
  if (document.hidden) return;
  const v = Math.floor(((performance.now() - moneyStart) % HOUR) / HOUR * 1e6);
  if (v !== lastMoney) { lastMoney = v; moneyEl.textContent = "$ " + v.toLocaleString("en-US"); }
}, 100);

// let the counter show through dark tabs (light-themed tabs keep their own background so text stays readable)
function seeThrough(f) {
  try {
    const d = f.contentDocument, bg = getComputedStyle(d.body).backgroundColor.match(/\d+/g);
    if (!bg || (+bg[0] * .299 + +bg[1] * .587 + +bg[2] * .114) > 80) return;
    d.documentElement.style.background = d.body.style.background = "transparent";
    // big solid dark panels become slightly see-through so the number shows faintly behind them
    const fade = () => d.querySelectorAll("body *").forEach(el => {
      if (el.dataset.moneyFaded || el.offsetWidth < 260 || el.offsetHeight < 60) return;
      const c = getComputedStyle(el).backgroundColor.match(/[\d.]+/g);
      if (!c || (c[3] !== undefined && +c[3] < 1) || (+c[0] * .299 + +c[1] * .587 + +c[2] * .114) > 80) return;
      el.style.backgroundColor = `rgba(${c[0]},${c[1]},${c[2]},.78)`; el.dataset.moneyFaded = 1;
    });
    fade(); new MutationObserver(fade).observe(d.body, { childList: true, subtree: true });
  } catch (e) {}
}
Object.values(frames).forEach(f => { f.addEventListener("load", () => seeThrough(f)); seeThrough(f); });

function whenForgeReady(fn, tries = 60) {
  const w = frames.clipforge.contentWindow;
  if (w && w.loadFromLibrary && w.document.readyState === "complete") fn(w);
  else if (tries > 0) setTimeout(() => whenForgeReady(fn, tries - 1), 150);
}
// called by the downloader tab after a clip is saved
window.openInForge = name => {
  show("clipforge");
  whenForgeReady(w => w.loadFromLibrary(name));
  toast("Loaded “" + name + "” into ClipForge");
};
// called by ClipForge when a finished edit is saved to My shorts
window.shortSaved = () => {
  document.getElementById("shortsBadge").style.display = "inline-block";
  try { frames.shorts.contentWindow.loadShorts(); } catch (e) {}
};
window.clipSaved = () => { document.getElementById("newBadge").style.display = "inline-block"; };

function toast(t) {
  const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600);
}

const q = new URLSearchParams(location.search).get("forge");
if (q) { history.replaceState(null, "", "/"); window.openInForge(q); }
else show(location.hash.slice(1) || "downloader");
</script>
</body>
</html>
